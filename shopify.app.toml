# Delivered ROAS by Better Sales. Fill client_id and the two URLs, then run `shopify app deploy`.
client_id = ""
name = "Delivered ROAS"
application_url = "https://delivered-roas.vercel.app"
embedded = true

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true

[access_scopes]
# read_orders covers the last 60 days, which is exactly the import window.
# read_customers is needed for the customer id used as Meta's external_id.
scopes = "read_orders,read_customers,read_fulfillments,write_pixels,read_customer_events"

[auth]
redirect_urls = ["https://delivered-roas.vercel.app/auth/callback"]

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = ["app/scopes_update"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders"
  topics = ["orders/create", "orders/updated", "orders/cancelled"]

  # Mandatory privacy topics (required for the App Store, harmless for custom distribution)
  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]

[pos]
embedded = false
